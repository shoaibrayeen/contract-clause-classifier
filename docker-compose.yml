services:
  api:
    build: .
    image: contract-clause-classifier:1.0.0
    container_name: contract-clause-classifier
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      RUNS_DIR: /app/artifacts/runs          # every version is served; requests default to the latest transformer
      CLASSICAL_RUNS_DIR: /app/artifacts/classical/runs   # classical models (POST /v1/compare, playground compare mode)
      DATA_DIR: /app/data
      DEVICE: cpu
    volumes:
      # All model versions live in artifacts/runs/<run>-v<N>/merged.
      - ./artifacts:/app/artifacts:ro
      # Raw LEDGAR parquet for /v1/dataset (downloaded on first request if missing).
      - ./data:/app/data
    restart: unless-stopped
