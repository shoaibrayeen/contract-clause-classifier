# Services for the clause classifier. `make` drives them (RUNNER=docker, the default):
#
#   api        the API, playground and model pages on http://localhost:${PORT:-8000} (`make serve`, `make docker-up`)
#   tools      one-off container for every pipeline step (`make data`, `make classical`, `make test`, ...)
#   tools-gpu  the same with CUDA torch and an NVIDIA GPU, for transformer training on Linux (`make train GPU=1`)
#
# `docker compose up` starts only the api; the tools services run through `docker compose run --rm tools ...`.
# The project folder must be shared with the Docker VM (Colima: `mounts:` in ~/.colima/default/colima.yaml).

services:
  api:
    build:
      context: .
      target: api
    image: ${IMAGE:-contract-clause-classifier:1.0.0}
    container_name: contract-clause-classifier
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      RUNS_DIR: /app/artifacts/runs          # every version is served; requests default to the latest transformer
      CLASSICAL_RUNS_DIR: /app/artifacts/classical/runs   # classical models (POST /v1/compare, playground compare mode)
      PAGES_DIR: /app/docs/models
      DATA_DIR: /app/data
      DEVICE: cpu
    volumes:
      # All model versions live in artifacts/runs/<run>-v<N>/merged and artifacts/classical/runs/<run>-v<N>/merged.
      - ./artifacts:/app/artifacts:ro
      # Raw LEDGAR parquet for /v1/dataset.
      - ./data:/app/data
      # Model pages as last generated by `make model-pages` (the image holds a copy from build time).
      - ./docs/models:/app/docs/models:ro
    restart: unless-stopped

  tools:
    profiles: ["tools"]
    build:
      context: .
      target: tools
    image: ${TOOLS_IMAGE:-contract-clause-classifier-tools:1.0.0}
    # Run as the host user so files written to the project are owned by you (set by the Makefile).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Mounted under its own folder name so console paths read like a local run (contract-clause-classifier/...).
    working_dir: /work/${PROJECT_DIR:-contract-clause-classifier}
    environment:
      DEVICE: ${DEVICE:-auto}
      PYTHONPATH: /work/${PROJECT_DIR:-contract-clause-classifier}/src
    volumes:
      - .:/work/${PROJECT_DIR:-contract-clause-classifier}
      # Hugging Face downloads (Qwen3 tokenizer and base weights) survive between runs.
      - hf-cache:/cache/huggingface
    # PyTorch data loading uses shared memory; Docker's default of 64 MB is too small.
    shm_size: "2gb"

  tools-gpu:
    profiles: ["gpu"]
    extends: tools
    build:
      context: .
      target: tools
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu130
    image: contract-clause-classifier-tools-gpu:1.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
